<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME & MUSIC - Random Pick Site</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="logo">GAME & MUSIC</div>
            <nav class="menu">
                <button class="menu-btn active">메인</button>
                <button class="menu-btn">카테고리</button>
                <button class="menu-btn">추천</button>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="top-header">
                <div class="search-bar">
                    <input type="text" placeholder="검색어를 입력하세요...">
                </div>
                <div class="user-profile">
                    <span class="nickname">사용자 닉네임</span>
                    <img src="images/profile-placeholder.png" alt="프로필" class="profile-img">
                </div>
            </header>

            <section class="hero-section">
                <div class="intro-text">
                    <p class="sub-title">"오늘의 게임 조합 추천"</p>
                    <h1 class="main-title">GAME & MUSIC<br>RANDOM PICK SITE</h1>
                </div>
                
                <div class="card-slider">
                    <div class="card side-card-left">이전 게임</div>
                    <div class="card center-card">
                        <span class="card-tag">게임</span>
                        </div>
                    <div class="card side-card-right">다음 게임</div>
                </div>

                <button class="start-btn">START</button>
            </section>

            <section class="ranking-section">
                <h2>추천 순위</h2>
                <div class="ranking-list">
                    </div>
            </section>

        </main>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
